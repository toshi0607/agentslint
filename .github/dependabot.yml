version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # vitest 4 系は rolldown ネイティブバインディングの engines 制約で
      # ローカル環境(Node 22.3.0)で動かないため major 更新を止める(tasks/todo.md Notes 参照)
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
